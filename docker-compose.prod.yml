services:
  myapp:
    build:
      context: ./nextjs-app
      dockerfile: Dockerfile
      args:
        - BACKEND_API_URL=${BACKEND_API_URL:-}
    container_name: myapp
    restart: unless-stopped
    # No ports exposed - runs behind reverse proxy (nginx, Traefik, etc.)
    environment:
      - BACKEND_API_URL=${BACKEND_API_URL:-}
      - HOSTNAME=0.0.0.0
      # Production: SECURE_COOKIE=true (requires HTTPS)
      - SECURE_COOKIE=${SECURE_COOKIE:-true}
      # Set RESET_DB=true to run migrations on container start
      - RESET_DB=${RESET_DB:-false}
    volumes:
      - ${DB_VOLUME_PATH}:/app/db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

networks:
  app-network:
    external: false