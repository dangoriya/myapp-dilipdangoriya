services:
  myapp:
    build:
      context: ./nextjs-app
      dockerfile: Dockerfile
      args:
        - BACKEND_API_URL=${BACKEND_API_URL:-}
    container_name: myapp
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      - BACKEND_API_URL=${BACKEND_API_URL:-}
      - HOSTNAME=0.0.0.0
      # Set environment variable SECURE_COOKIE=true in production when serving over HTTPS
      - SECURE_COOKIE=${SECURE_COOKIE:-false}
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
